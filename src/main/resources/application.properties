# ============================================================================
# CONFIGURAÇÕES DO SPRING BOOT - ERP ARECOLÓGICO
# Baseado nos conceitos do PDF (Slides 35 e 36)
# ============================================================================

# 1. Identificação da Aplicação Spring Boot
spring.application.name=erp

# ============================================================================
# 2. CONFIGURAÇÃO DE BANCO DE DADOS: MICROSOFT SQL SERVER (Slide 35 do PDF)
# ============================================================================
# URL de conexão JDBC para o SQL Server (instância local ou servidor com banco ArecologicoERP)
# Parâmetros adicionais: encrypt=true e trustServerCertificate=true para suporte SSL/TLS
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ArecologicoERP;encrypt=true;trustServerCertificate=true

# Credenciais de acesso ao banco de dados
spring.datasource.username=sa
spring.datasource.password=suaSenha123

# Driver JDBC oficial da Microsoft para SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================================
# 3. CONFIGURAÇÕES DO HIBERNATE / JPA (Slide 35 do PDF)
# ============================================================================
# Ativa o log e exibe no console todos os comandos SQL executados pelo Hibernate
spring.jpa.show-sql=true

# Formata as instruções SQL no console para facilitar a leitura e depuração
spring.jpa.properties.hibernate.format_sql=true

# Define a estratégia de gerenciamento do schema do banco:
# - none: Nenhuma ação no banco (ideal quando o script dba.sql já foi executado)
# - validate: Valida se as tabelas e colunas coincidem com as entidades JPA
# - update: Atualiza as tabelas automaticamente sem apagar os dados existentes
# - create-drop: Cria as tabelas ao iniciar e descarta ao desligar (útil para testes/desenvolvimento)
spring.jpa.hibernate.ddl-auto=none

# Define o dialeto SQL específico para o Microsoft SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ============================================================================
# 4. CONFIGURAÇÃO DE CHARSET E ENCODING (Slide 36 do PDF)
# ============================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

